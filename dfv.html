<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portada Corporativa Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* VARIABLES DE COLOR METÁLICAS */
    :root {
      --bg-dark: #070709;
      --gold-1: #dfba61;
      --gold-2: #f9e8a2;
      --gold-3: #9b722b;
      --silver-1: #e0e0e0;
      --silver-2: #ffffff;
      --silver-3: #757575;
      --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --silver-gradient: linear-gradient(135deg, #d8d8d8 0%, #ffffff 50%, #8a8a8a 100%);
      --glass-bg: rgba(18, 18, 24, 0.65);
      --glass-border: rgba(223, 186, 97, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* CANVAS DE FONDO CON PARTÍCULAS */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* BARRA DE NAVEGACIÓN (NAVBAR) */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1rem 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 7, 9, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 100;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-img-nav {
      height: 48px;
      width: auto;
      filter: invert(1);
      mix-blend-mode: screen;
      transition: transform 0.3s ease;
    }

    .logo-container:hover .logo-img-nav {
      transform: scale(1.08);
    }

    .nav-menu {
      display: flex;
      gap: 2.2rem;
      list-style: none;
    }

    .nav-item a {
      color: var(--silver-1);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      position: relative;
      padding: 6px 0;
      transition: color 0.3s ease;
    }

    .nav-item a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--gold-gradient);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .nav-item a:hover {
      color: var(--gold-2);
    }

    .nav-item a:hover::after {
      width: 100%;
    }

    /* HERO PRINCIPAL */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 100px 20px 40px;
    }

    .hero-logo-wrapper {
      position: relative;
      margin-bottom: 2rem;
    }

    .hero-logo-wrapper::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(223, 186, 97, 0.25) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      animation: pulseGlow 4s infinite ease-in-out;
      z-index: -1;
    }

    .hero-logo-img {
      width: 190px;
      height: auto;
      filter: invert(1) drop-shadow(0 0 15px rgba(223, 186, 97, 0.4));
      mix-blend-mode: screen;
      transition: transform 0.5s ease;
    }

    .hero-logo-img:hover {
      transform: scale(1.05) rotate(-1deg);
    }

    .hero-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.5rem;
      color: var(--silver-1);
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .hero-title {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }

    .badge-process {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-radius: 50px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--gold-1);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--gold-1);
      animation: blink 1.5s infinite;
    }

    .badge-text {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--silver-1);
    }

    /* TARJETAS GLASSMORPHISM */
    .sections-grid {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto 100px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
    }

    .section-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 3rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .section-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--gold-gradient);
      opacity: 0.4;
      transition: opacity 0.3s ease;
    }

    .section-card:hover {
      transform: translateY(-12px);
      border-color: rgba(223, 186, 97, 0.7);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px rgba(223, 186, 97, 0.25);
    }

    .section-card:hover::before {
      opacity: 1;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--silver-2);
      margin-bottom: 0.8rem;
      letter-spacing: 1px;
    }

    .card-status {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-1);
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(223, 186, 97, 0.1);
      border: 1px solid rgba(223, 186, 97, 0.2);
    }

    /* MUÑECO GUÍA Y BOCADILLO */
    .guide-wrapper {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 999;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      cursor: pointer;
    }

    .guide-bubble {
      background: rgba(12, 12, 18, 0.95);
      border: 1px solid var(--gold-1);
      color: var(--silver-2);
      padding: 14px 20px;
      border-radius: 20px;
      border-bottom-right-radius: 4px;
      font-size: 0.88rem;
      max-width: 240px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(223, 186, 97, 0.2);
      animation: floatBubble 4s infinite ease-in-out;
      line-height: 1.4;
      transition: opacity 0.2s ease;
    }

    #guide-canvas {
      width: 85px;
      height: 85px;
      filter: drop-shadow(0 5px 15px rgba(223, 186, 97, 0.3));
      transition: transform 0.3s ease;
    }

    .guide-wrapper:hover #guide-canvas {
      transform: scale(1.1);
    }

    /* ANIMACIONES */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* ADAPTABILIDAD MÓVIL */
    @media (max-width: 850px) {
      header { flex-direction: column; gap: 1rem; padding: 1rem; }
      .nav-menu { gap: 1.2rem; flex-wrap: wrap; justify-content: center; }
      .hero-title { font-size: 2.2rem; }
      .guide-bubble { display: none; }
    }
  </style>
</head>
<body>

  <!-- CANVA DE PARTÍCULAS -->
  <canvas id="bg-canvas"></canvas>

  <!-- NAVEGACIÓN -->
  <header>
    <a href="#" class="logo-container">
      <img src="logo.jpg" alt="Logo Corporativo" class="logo-img-nav">
    </a>
    <ul class="nav-menu">
      <li class="nav-item"><a href="#quinta-lina" onclick="guideSpeak('Sección Quinta Lina en desarrollo.')">Quinta Lina</a></li>
      <li class="nav-item"><a href="#marina-bay" onclick="guideSpeak('Sección Marina Bay próximamente disponible.')">Marina Bay</a></li>
      <li class="nav-item"><a href="#kostemetria" onclick="guideSpeak('Kostemetria estará lista muy pronto.')">Kostemetria</a></li>
      <li class="nav-item"><a href="#eventos" onclick="guideSpeak('Eventos exclusivos muy pronto.')">Eventos</a></li>
    </ul>
  </header>

  <!-- SECCIÓN HERO -->
  <main class="hero">
    <div class="hero-logo-wrapper">
      <img src="logo.jpg" alt="Logo Principal" class="hero-logo-img">
    </div>
    <p class="hero-subtitle">Bienvenido a nuestra plataforma</p>
    <h1 class="hero-title">EN CONSTRUCCIÓN</h1>
    
    <div class="badge-process">
      <span class="badge-dot"></span>
      <span class="badge-text">Información en Proceso</span>
    </div>
  </main>

  <!-- SECCIONES EN PROCESO -->
  <section class="sections-grid">
    <div class="section-card" onclick="guideSpeak('Quinta Lina: Estamos preparando contenido exclusivo.')">
      <h3 class="card-title">Quinta Lina</h3>
      <span class="card-status">En proceso</span>
    </div>
    <div class="section-card" onclick="guideSpeak('Marina Bay: Próximamente mayor información.')">
      <h3 class="card-title">Marina Bay</h3>
      <span class="card-status">En proceso</span>
    </div>
    <div class="section-card" onclick="guideSpeak('Kostemetria: Servicios y catálogo en preparación.')">
      <h3 class="card-title">Kostemetria</h3>
      <span class="card-status">En proceso</span>
    </div>
    <div class="section-card" onclick="guideSpeak('Eventos: Galería y fechas en camino.')">
      <h3 class="card-title">Eventos</h3>
      <span class="card-status">En proceso</span>
    </div>
  </section>

  <!-- MUÑECO GUÍA INTERACTIVO -->
  <div class="guide-wrapper" onclick="guideSpeak('¡Hola! Soy tu asistente. Haz clic en las opciones para guiarte.')">
    <div class="guide-bubble" id="guide-text">
      ¡Hola! Haz clic en cualquier sección para darte más detalles.
    </div>
    <canvas id="guide-canvas" width="100" height="100"></canvas>
  </div>

  <script>
    // 1. PARTICULAS EN CANVAS (FONDO DESTELLANTE)
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.color = Math.random() > 0.4 ? '#dfba61' : '#ffffff';
        this.alpha = Math.random() * 0.7 + 0.1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 85; i++) {
      particles.push(new Particle());
    }

    function renderBg() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(renderBg);
    }
    renderBg();

    // 2. MUÑECO GUÍA ANIMADO (ROBOT CANVAS)
    const gCanvas = document.getElementById('guide-canvas');
    const gCtx = gCanvas.getContext('2d');
    let step = 0;

    function drawGuide() {
      gCtx.clearRect(0, 0, 100, 100);
      let floatY = Math.sin(step) * 4;

      // Cabeza / Cuerpo esférico
      gCtx.fillStyle = '#0f0f15';
      gCtx.strokeStyle = '#dfba61';
      gCtx.lineWidth = 2.5;
      gCtx.beginPath();
      gCtx.arc(50, 48 + floatY, 26, 0, Math.PI * 2);
      gCtx.fill();
      gCtx.stroke();

      // Visor
      gCtx.fillStyle = '#1e1e28';
      gCtx.beginPath();
      gCtx.ellipse(50, 46 + floatY, 16, 9, 0, 0, Math.PI * 2);
      gCtx.fill();
      gCtx.strokeStyle = '#ffffff';
      gCtx.lineWidth = 1;
      gCtx.stroke();

      // Ojos brillantes
      gCtx.fillStyle = '#dfba61';
      let pupilX = Math.sin(step * 0.7) * 3;
      gCtx.beginPath();
      gCtx.arc(43 + pupilX, 46 + floatY, 3.5, 0, Math.PI * 2);
      gCtx.arc(57 + pupilX, 46 + floatY, 3.5, 0, Math.PI * 2);
      gCtx.fill();

      // Antena
      gCtx.strokeStyle = '#dfba61';
      gCtx.lineWidth = 2;
      gCtx.beginPath();
      gCtx.moveTo(50, 22 + floatY);
      gCtx.lineTo(50, 14 + floatY);
      gCtx.stroke();

      gCtx.fillStyle = '#ffffff';
      gCtx.beginPath();
      gCtx.arc(50, 12 + floatY, 4, 0, Math.PI * 2);
      gCtx.fill();

      step += 0.04;
      requestAnimationFrame(drawGuide);
    }
    drawGuide();

    // 3. CAMBIO DE TEXTO DEL BOCADILLO
    function guideSpeak(text) {
      const bubble = document.getElementById('guide-text');
      bubble.style.opacity = '0';
      setTimeout(() => {
        bubble.innerText = text;
        bubble.style.opacity = '1';
      }, 150);
    }
  </script>
</body>
</html>
